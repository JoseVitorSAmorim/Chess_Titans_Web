name: Deploy do Xadrez 3D para o GitHub Pages

on:
  # Dispara automaticamente quando houver commit na branch main
  push:
    branches: ["main"]

  # PERMITE DISPARAR O DEPLOY MANUALMENTE PELO GITHUB
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código fonte
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Enviar artefatos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Fazer Deploy
        id: deployment
        uses: actions/deploy-pages@v4
